# Site Build Settings

# Build settings
markdown: kramdown
highlighter: rouge
permalink: none
plugins:
  # Generates a sitemap for search engines.
  - jekyll-sitemap
  # Generates the site's Atom feed.
  - jekyll-feed
  # Adds SEO metadata to each page.
  - jekyll-seo-tag
  # Opens external links in a new tab.
  - jekyll-target-blank
  # Converts emoji shortcodes into emoji images.
  - jemoji
  # Adds content hashes to local asset URLs so deploys bypass stale caches.
  - jekyll-cache-bust
  # Turns <https://example.com> as its own paragraph into a static link preview.
  # The angle brackets are kramdown's autolink syntax; without them, the URL is
  # plain text and the plugin has no link to enhance. The plugin fetches the
  # linked page's metadata during the build; ogp.html and fallback.html control
  # the generated markup.
  - jekyll-embed-urls

embed:
  attributes:
    # Do not tell remote image hosts which page on this domain loaded them.
    referrerpolicy: no-referrer
    # The embed plugin runs before jekyll-target-blank. Suppress its rel values
    # so jekyll-target-blank adds one copy of "noopener noreferrer", not two.
    rel: false

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title: "Claire Nord"
description: "Claire's personal website"
author: "Claire Nord"
url: "https://clairenord.com"

# On the homepage, jekyll-seo-tag writes these official profiles to the
# JSON-LD `sameAs` property. They help identify which Claire Nord this site
# represents; their order does not indicate importance.
social:
  name: "Claire Nord"
  links:
    - "https://github.com/cmnord"
    - "https://linkedin.com/in/cmnord"
    - "https://scholar.google.com/citations?user=FdBYqlcAAAAJ&hl=en"

buttondown_username: "cnord"

# https://github.com/github/pages-gem/issues/399
github: [metadata]
