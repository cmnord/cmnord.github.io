{% assign share_url = page.url | absolute_url %}
{% capture bluesky_text %}{{ page.title }} {{ share_url }}{% endcapture %}
<div class="post-date">{{ site.data.settings.sharing_button_prompt }}</div>
<div class="sharing-icons">
  <button type="button" data-native-share data-share-title="{{ page.title | escape }}" data-share-url="{{ share_url }}" aria-label="Share this post" title="Share" hidden><i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i></button>
  <a href="https://bsky.app/intent/compose?text={{ bluesky_text | strip | url_encode }}" aria-label="Share on Bluesky" title="Share on Bluesky"><i class="fa-brands fa-bluesky" aria-hidden="true"></i></a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}" aria-label="Share on LinkedIn" title="Share on LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
  <a href="https://x.com/intent/post?text={{ page.title | url_encode }}&amp;url={{ share_url | url_encode }}" aria-label="Share on X" title="Share on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
</div>
<script src="{{ site.github.url }}/assets/js/social-sharing.js" defer></script>
