<div class="post-meta">
  <span>{{ page.date | date: "%-d %b %Y" }}</span>
  {% if page.shared %}
    <span>
      &mdash; shared on
      {% for item in page.shared -%}
        <a href="{{ item.url }}">{{ item.name }}</a>
        {%- unless forloop.last -%}
          {%- if forloop.rindex == 2 %} and {% else %}, {% endif -%}
        {%- endunless -%}
      {%- endfor %}
    </span>
  {% endif %}
</div>
