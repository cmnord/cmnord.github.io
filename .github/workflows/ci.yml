name: Build Jekyll site

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: github:oxc-project/oxc
      - name: Check formatting
        run: mise exec -- oxfmt --check .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: mise.toml
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Validate generated links, images, and scripts
        run: ./scripts/check-html.sh
      - name: Generate newsletter preview
        run: >-
          bundle exec ruby scripts/publish-to-buttondown.rb
          --output html _posts/2026-08-11-whoport.md
          > "$RUNNER_TEMP/newsletter-preview.html"
      - name: Upload newsletter preview
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-preview
          path: ${{ runner.temp }}/newsletter-preview.html
