name: Build Jekyll site

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OXFMT_RELEASE: apps_v1.78.0
      OXFMT_SHA256: 0c864d8ff6a6f1eed0123566def99450c156627edbad9cd507c8ce05e8012002
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install oxfmt
        run: |
          archive_path="$RUNNER_TEMP/oxfmt.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/oxc-project/oxc/releases/download/$OXFMT_RELEASE/oxfmt-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive_path"
          printf '%s  %s\n' "$OXFMT_SHA256" "$archive_path" | sha256sum --check
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          install --mode 0755 "$RUNNER_TEMP/oxfmt-x86_64-unknown-linux-gnu" "$RUNNER_TEMP/oxfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check formatting
        run: oxfmt --check .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: mise.toml
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
